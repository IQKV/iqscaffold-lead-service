# UAT Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: LeadServiceHikariPool-Staging
      maximum-pool-size: 15
      minimum-idle: 3

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://uat-db:5432/iqscaffold_lead_uat}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:redis-staging}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 16
        min-idle: 2
      key-prefix: "iqscaffold:lead:staging"
      default-ttl: PT30M
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:rabbitmq-staging}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
  
  lead:
    qualification:
      enable-auto-qualification: true
      require-phone: true

logging:
  level:
    org.hibernate.SQL: WARN
