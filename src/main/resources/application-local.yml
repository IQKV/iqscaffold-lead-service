# Local Development Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: LeadServiceHikariPool-Local

  jpa:
    show-sql: true

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_lead_local}
  
  cache:
    redis:
      key-prefix: "iqscaffold:lead:local"
      enable-statistics: true
  
  lead:
    scoring:
      min-qualification-score: 50

logging:
  level:
    org.hibernate.SQL: DEBUG
