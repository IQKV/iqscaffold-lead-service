spring:
  main:
    allow-bean-definition-overriding: true  # Allow test beans to override production beans
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # Multi-tenancy is DISABLED for integration tests
        # All tests run in a single schema without tenant isolation
        # To enable: set to SCHEMA and configure TestTenantConfiguration
        multiTenancy: NONE
        cache:
          use_second_level_cache: false  # Disable second level cache for tests
          use_query_cache: false
  
  liquibase:
    enabled: false  # Disable Liquibase for tests
  
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://iqscaffold-user-service/.well-known/jwks.json

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.iqscaffold.leadservice: DEBUG

# Disable resilience4j for tests to allow proper mocking
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: false
    instances:
      contactService:
        registerHealthIndicator: false
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  retry:
    configs:
      default:
        maxAttempts: 1  # Disable retries in tests
    instances:
      contactService:
        maxAttempts: 1
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
    instances:
      contactService:
        timeoutDuration: 10s

# Test-specific IQ  Key Value properties
iqscaffold:
  tenant-id-header: X-Tenant-ID
  user-service-url: http://iqscaffold-user-service
  bootstrap:
    default-tenant-schema:
      enabled: false
  liquibase:
    system-schema:
      enabled: false
  lead:
    scoring:
      enable-auto-scoring: true
      default-score: 0
      max-score: 100
      min-qualification-score: 60
    qualification:
      enable-auto-qualification: false
      require-email: true
      require-phone: false
      require-company: false
