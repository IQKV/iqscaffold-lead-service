services:
  # PostgreSQL Database for Lead Service
  postgres-lead:
    extends:
      file: compose.base.yaml
      service: postgres-lead

  # Redis for Lead Service
  redis-lead:
    extends:
      file: compose.base.yaml
      service: redis-lead

  # RabbitMQ for Lead Service
  rabbitmq-lead:
    extends:
      file: compose.base.yaml
      service: rabbitmq-lead

  # Lead Service - Full platform run including build phase
  lead-service:
    extends:
      file: compose.base.yaml
      service: lead-service

networks:
  lead-service-network:
    name: iqscaffold-lead-network-dev
    external: false

volumes:
  postgres_lead_data:
    name: iqscaffold_lead_postgres_data_dev
  redis_lead_data:
    name: iqscaffold_lead_redis_data_dev
  rabbitmq_lead_data:
    name: iqscaffold_lead_rabbitmq_data_dev
  lead_logs:
    name: iqscaffold_lead_logs_dev
  lead_tmp:
    name: iqscaffold_lead_tmp_dev
